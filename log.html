<!DOCTYPE html>
<html lang="ja">
<head>

<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Timer Log</title>

<style>

@font-face {
    font-family: DSEG7;
    src: url("https://manzdev.github.io/twitch-casio/dseg7-bold.woff2");
}

body {
    background: black;
    color: white;
    font-family: Arial, sans-serif;
    padding: 30px;
}

h1 {
    text-align: center;
}

table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 30px;
}

th,
td {
    border: 1px solid #555;
    padding: 12px;
    text-align: center;
}

th {
    background: #222;
}

.blue {
    color: #4666FF;
}

button {
    display: block;
    margin: 30px auto;
    padding: 12px 30px;
    font-size: 16px;
}

</style>

</head>

<body>

<h1>Timer Log</h1>

<table>

<thead>

<tr>
    <th>STOPPED AT</th>
    <th>TIMER</th>
    <th>TIME LEFT</th>
</tr>

</thead>

<tbody id="logBody"></tbody>

</table>

<button id="clear">
    CLEAR LOG
</button>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
    "https://hkogobchcvryyzuelfxw.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_anNXiP87LyAP-HUE-5tlGQ_ia6q2xEE";

const db = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


async function loadLog() {

    const { data, error } = await db
        .from("timer_logs")
        .select("*")
        .order(
            "stopped_at",
            { ascending: false }
        );


    if (error) {

        console.error(error);

        document.getElementById("logBody").innerHTML =
            `<tr>
                <td colspan="3">
                    FAILED TO LOAD LOG
                </td>
             </tr>`;

        return;
    }


    const body =
        document.getElementById("logBody");

    body.innerHTML = "";


    data.forEach(row => {

        const tr =
            document.createElement("tr");

        if (row.remaining_seconds >= 30) {
            tr.classList.add("blue");
        }


        const date =
            new Date(row.stopped_at);

        tr.innerHTML = `
            <td>
                ${date.toLocaleString("ja-JP")}
            </td>

            <td>
                ${row.label}
            </td>

            <td>
                ${row.remaining_formatted}
            </td>
        `;

        body.appendChild(tr);

    });

}


/* ログ全削除 */

document.getElementById("clear")
    .addEventListener("click", async () => {

        if (!confirm("ログをすべて削除しますか？"))
            return;

        const { error } = await db
            .from("timer_logs")
            .delete()
            .not("id", "is", null);

        if (error) {

            alert(
                "削除に失敗しました。\n\n" +
                error.message
            );

            return;
        }

        loadLog();

    });


/* 初回読み込み */

loadLog();


/* Realtime */

db
    .channel("timer-log-realtime")
    .on(
        "postgres_changes",
        {
            event: "*",
            schema: "public",
            table: "timer_logs"
        },
        () => {
            loadLog();
        }
    )
    .subscribe();

</script>

</body>
</html>
