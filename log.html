<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Timer Log</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            background: #111;
            color: #fff;
            font-family: Arial, sans-serif;
        }

        h1 {
            margin: 0 0 20px;
            font-size: 28px;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        button {
            padding: 10px 16px;
            border: none;
            border-radius: 6px;
            background: #444;
            color: #fff;
            cursor: pointer;
            font-size: 14px;
        }

        button:hover {
            background: #666;
        }

        .table-container {
            width: 100%;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: #1b1b1b;
        }

        th,
        td {
            border: 1px solid #444;
            padding: 10px;
            text-align: center;
            white-space: nowrap;
        }

        th {
            background: #292929;
            font-weight: bold;
        }

        td {
            background: #181818;
        }

        .swt {
            font-weight: bold;
        }

        .empty {
            padding: 30px;
            text-align: center;
            color: #999;
        }
    </style>
</head>

<body>

    <div class="top-bar">
        <h1>Timer Log</h1>

        <button id="clearButton">
            Clear Log
        </button>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>STOPPED AT</th>
                    <th>TIMER</th>
                    <th>TIME LEFT</th>
                    <th>SWT</th>
                </tr>
            </thead>

            <tbody id="logBody">
            </tbody>
        </table>
    </div>

    <script>
        const SUPABASE_URL =
            "https://hkogobchcvryyzuelfx.supabase.co";

        const SUPABASE_KEY =
            "sb_publishable_anNXiP87LyAP-HUE-5tlGQ_ia6q2xEE";

        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );


        // --------------------------------
        // HTMLエスケープ
        // --------------------------------

        function escapeHtml(value) {
            return String(value ?? "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }


        // --------------------------------
        // タイマー名を判定
        //
        // 1m25s = T
        // 1m30s = W
        // 1m35s = S
        // --------------------------------

        function getTimerName(label) {

            if (label === "1m25s") {
                return "T";
            }

            if (label === "1m30s") {
                return "W";
            }

            if (label === "1m35s") {
                return "S";
            }

            return "";
        }


        // --------------------------------
        // ログ読み込み
        // --------------------------------

        async function loadLogs() {

            const { data, error } = await supabaseClient
                .from("timer_logs")
                .select("*")
                .order("stopped_at", {
                    ascending: true
                });

            if (error) {
                console.error(
                    "ログ取得エラー:",
                    error
                );

                return;
            }


            // --------------------------------
            // S / W / T の番号を独立してカウント
            // --------------------------------

            let sCount = 0;
            let wCount = 0;
            let tCount = 0;


            const logs = data.map(log => {

                const timerName =
                    getTimerName(log.label);

                let swtNo = "";


                if (timerName === "S") {

                    sCount++;

                    swtNo = `S${sCount}`;

                } else if (timerName === "W") {

                    wCount++;

                    swtNo = `W${wCount}`;

                } else if (timerName === "T") {

                    tCount++;

                    swtNo = `T${tCount}`;
                }


                return {
                    ...log,
                    swtNo
                };
            });


            // --------------------------------
            // 表示は新しいログを上にする
            // --------------------------------

            logs.reverse();


            const logBody =
                document.getElementById("logBody");


            if (logs.length === 0) {

                logBody.innerHTML = `
                    <tr>
                        <td
                            colspan="4"
                            class="empty"
                        >
                            ログはありません
                        </td>
                    </tr>
                `;

                return;
            }


            // --------------------------------
            // テーブル生成
            // --------------------------------

            logBody.innerHTML = logs.map(log => {

                return `
                    <tr>
                        <td>
                            ${escapeHtml(
                                formatDate(log.stopped_at)
                            )}
                        </td>

                        <td>
                            ${escapeHtml(
                                log.label
                            )}
                        </td>

                        <td>
                            ${escapeHtml(
                                log.remaining_formatted
                            )}
                        </td>

                        <td class="swt">
                            ${escapeHtml(
                                log.swtNo
                            )}
                        </td>
                    </tr>
                `;

            }).join("");
        }


        // --------------------------------
        // 日時表示
        // --------------------------------

        function formatDate(dateString) {

            if (!dateString) {
                return "";
            }

            const date =
                new Date(dateString);

            if (Number.isNaN(date.getTime())) {
                return dateString;
            }

            return date.toLocaleString(
                "ja-JP",
                {
                    year: "numeric",
                    month: "2-digit",
                    day: "2-digit",
                    hour: "2-digit",
                    minute: "2-digit",
                    second: "2-digit"
                }
            );
        }


        // --------------------------------
        // ログ全削除
        // --------------------------------

        document
            .getElementById("clearButton")
            .addEventListener(
                "click",
                async () => {

                    const result =
                        confirm(
                            "すべてのログを削除しますか？"
                        );

                    if (!result) {
                        return;
                    }


                    const { error } =
                        await supabaseClient
                            .from("timer_logs")
                            .delete()
                            .not(
                                "id",
                                "is",
                                null
                            );


                    if (error) {

                        console.error(
                            "ログ削除エラー:",
                            error
                        );

                        alert(
                            "ログの削除に失敗しました。"
                        );

                        return;
                    }


                    await loadLogs();
                }
            );


        // --------------------------------
        // Supabase Realtime
        // --------------------------------

        supabaseClient
            .channel("timer_logs_changes")

            .on(
                "postgres_changes",
                {
                    event: "*",
                    schema: "public",
                    table: "timer_logs"
                },
                () => {

                    loadLogs();
                }
            )

            .subscribe();


        // --------------------------------
        // 初回読み込み
        // --------------------------------

        loadLogs();

    </script>

</body>
</html>
