<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
               maximum-scale=1.0, user-scalable=no">

<title>Timer</title>

<style>

@font-face {
    font-family: "DSEG7 Classic";

    src:
        url("https://manzdev.github.io/twitch-casio/dseg7-bold.woff2")
        format("woff2"),
        url("https://manzdev.github.io/twitch-casio/dseg7-bold.woff")
        format("woff");

    font-display: swap;
}


* {
    box-sizing: border-box;
}


html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
}


body {

    font-family:
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        sans-serif;

    background: #000000;

    color: #39FF14;

    display: flex;

    flex-direction: column;

    align-items: center;

    overflow: hidden;

    touch-action: manipulation;

    /*
     * キーボードフォーカスを受け取れるようにする
     */
    outline: none;
}


/* =========================
   初期画面
========================= */

h1 {

    font-size: 18px;

    color: #39FF14;

    margin: 24px 0 4px;

    letter-spacing: 3px;

    font-weight: 500;
}


.hint {

    font-size: 11px;

    color: #3d5c35;

    margin-bottom: 20px;

    letter-spacing: 1px;

    text-align: center;

    transition: opacity 0.2s;
}


/* =========================
   タイマー選択エリア
========================= */

.timers {

    display: flex;

    flex-wrap: wrap;

    gap: 40px;

    justify-content: center;

    align-items: flex-start;

    width: 100%;

    max-width: 900px;

    padding: 0 16px;
}


.card {

    text-align: center;

    padding: 8px;

    cursor: pointer;

    opacity: 0.55;

    transition: opacity 0.15s;
}


.card.selected {
    opacity: 1;
}


.card h2 {

    font-size: 14px;

    color: #39FF14;

    margin: 0 0 10px;

    font-weight: 500;

    letter-spacing: 1px;
}


.card .display {

    font-family:
        "DSEG7 Classic",
        "DSEG",
        monospace;

    font-size: 36px;

    color: #39FF14;

    margin-bottom: 14px;

    letter-spacing: 2px;
}


/* =========================
   STARTボタン
========================= */

button {

    border: none;

    border-radius: 999px;

    padding: 8px 24px;

    font-size: 13px;

    font-weight: 600;

    cursor: pointer;

    font-family: inherit;

    -webkit-tap-highlight-color: transparent;
}


.start-btn {

    background: #39FF14;

    color: #0a0a0a;
}


.start-btn:hover {
    opacity: 0.85;
}


.start-btn:active {
    transform: scale(0.96);
}


/* =========================
   実行中画面
========================= */

.running-screen {

    position: fixed;

    top: 0;
    left: 0;

    width: 100vw;
    height: 100vh;

    display: none;

    pointer-events: none;

    z-index: 100;
}


.running-screen.show {
    display: block;
}


.running-number {

    position: absolute;

    top: 40%;
    left: 50%;

    transform:
        translate(-50%, -50%);

    font-family:
        "DSEG7 Classic",
        "DSEG",
        monospace;

    font-size: 22vw;

    line-height: 1;

    color: #39FF14;

    letter-spacing: 4px;

    white-space: nowrap;

    text-align: center;
}


.running-number.stopped-high {
    color: #3666FF;
}

.running-number.stopped-low {
    color: #FF6633;
}


/* =========================
   BGMボタン
========================= */

.audio-start {

    position: fixed;

    bottom: 18px;
    left: 50%;

    transform:
        translateX(-50%);

    z-index: 200;

    background: transparent;

    color: #3d5c35;

    border: 1px solid #3d5c35;

    padding: 6px 16px;

    font-size: 11px;

    letter-spacing: 0.5px;
}


.audio-start.hidden {
    display: none;
}


.hidden {
    display: none !important;
}

</style>

</head>


<body tabindex="-1">


<h1 id="title">
    TIMER
</h1>


<div id="hint" class="hint">
    Click to Select / Space to Start, pause or resume / Backspace to Cancel
</div>


<div id="timers" class="timers">


    <!-- T = 1分25秒 -->

    <div class="card selected"
         data-seconds="85"
         data-name="T">

        <h2>
            1m25s
        </h2>

        <div class="display">
            01:25
        </div>

        <button class="start-btn">
            START
        </button>

    </div>


    <!-- W = 1分30秒 -->

    <div class="card"
         data-seconds="90"
         data-name="W">

        <h2>
            1m30s
        </h2>

        <div class="display">
            01:30
        </div>

        <button class="start-btn">
            START
        </button>

    </div>


    <!-- S = 1分35秒 -->

    <div class="card"
         data-seconds="95"
         data-name="S">

        <h2>
            1m35s
        </h2>

        <div class="display">
            01:35
        </div>

        <button class="start-btn">
            START
        </button>

    </div>

</div>


<div id="runningScreen"
     class="running-screen">

    <div id="runningNumber"
         class="running-number">

        01:25

    </div>

</div>


<audio id="bgm"
       src="./bgmpacman.mp3"
       loop
       preload="auto">
</audio>


<button id="audioStart"
        class="audio-start">

    TAP TO START MUSIC

</button>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

/* =====================================================
   Supabase
===================================================== */

const SUPABASE_URL =
    "https://hkogobchcvryyzuelfxw.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_anNXiP87LyAP-HUE-5tlGQ_ia6q2xEE";


const db =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =====================================================
   DOM
===================================================== */

const title =
    document.getElementById("title");

const hint =
    document.getElementById("hint");

const timers =
    document.getElementById("timers");

const cards =
    document.querySelectorAll(".card");

const runningScreen =
    document.getElementById("runningScreen");

const runningNumber =
    document.getElementById("runningNumber");

const audioStart =
    document.getElementById("audioStart");

const bgm =
    document.getElementById("bgm");


/* =====================================================
   Timer variables
===================================================== */

let selected = 0;

let activeTimer = null;

let timerInterval = null;


/* =====================================================
   キーボードフォーカス対策
===================================================== */

/*
 * bodyをフォーカス可能にする
 */
function restoreKeyboardFocus() {

    /*
     * ボタンや入力欄を操作中の場合は
     * 無理にフォーカスを奪わない
     */
    const activeElement =
        document.activeElement;

    if (
        activeElement &&
        (
            activeElement.tagName === "INPUT" ||
            activeElement.tagName === "TEXTAREA" ||
            activeElement.tagName === "SELECT"
        )
    ) {
        return;
    }


    try {

        document.body.focus({
            preventScroll: true
        });

    } catch (error) {

        document.body.focus();

    }

}


/*
 * ページを開いた直後
 */
window.addEventListener(
    "load",
    () => {

        restoreKeyboardFocus();

    }
);


/*
 * ブラウザやアプリに戻ってきたとき
 */
window.addEventListener(
    "focus",
    () => {

        restoreKeyboardFocus();

    }
);


/*
 * Safari / iOS等でページが再表示されたとき
 */
document.addEventListener(
    "visibilitychange",
    () => {

        if (!document.hidden) {

            setTimeout(
                () => {

                    restoreKeyboardFocus();

                },
                50
            );

        }

    }
);


/*
 * 画面をタップ・クリックした後も
 * キーボード入力を受け取れるようにする
 */
document.addEventListener(
    "pointerdown",
    () => {

        setTimeout(
            () => {

                restoreKeyboardFocus();

            },
            0
        );

    },
    {
        passive: true
    }
);


/* =====================================================
   時間表示
===================================================== */

function formatTime(seconds) {
    const negative = seconds < 0;
    const absoluteSeconds = Math.abs(
        Math.floor(seconds)
    );

    const minutes =
        Math.floor(
            absoluteSeconds / 60
        )
            .toString()
            .padStart(2, "0");

    const secs =
        (absoluteSeconds % 60)
            .toString()
            .padStart(2, "0");

    return negative
        ? `-${minutes}:${secs}`
        : `${minutes}:${secs}`;
}


/* =====================================================
   選択表示
===================================================== */

function updateSelection() {

    cards.forEach(
        (card, index) => {

            card.classList.toggle(
                "selected",
                index === selected
            );

        }
    );

}


/* =====================================================
   BGM
===================================================== */

async function playBGM() {

    try {

        bgm.volume = 1.0;

        await bgm.play();

        audioStart.classList.add(
            "hidden"
        );

    } catch (error) {

        console.log(
            "BGM autoplay blocked:",
            error
        );

    }

}


audioStart.addEventListener(
    "click",
    async (event) => {

        event.stopPropagation();

        await playBGM();

        restoreKeyboardFocus();

    }
);


/*
 * 画面操作時にBGMを開始
 */
document.addEventListener(
    "pointerdown",
    () => {

        if (bgm.paused) {

            playBGM();

        }

    },
    {
        passive: true
    }
);


/* =====================================================
   タイマー開始
===================================================== */

function startTimer(cardIndex) {

    if (activeTimer) {
        return;
    }


    const seconds =
        Number(
            cards[cardIndex]
                .dataset
                .seconds
        );


    const timerName =
        cards[cardIndex]
            .dataset
            .name;


    activeTimer = {

        cardIndex: cardIndex,

        name: timerName,

        remaining: seconds,

        paused: false

    };


    title.classList.add(
        "hidden"
    );

    hint.classList.add(
        "hidden"
    );

    timers.classList.add(
        "hidden"
    );


    runningScreen.classList.add(
        "show"
    );


    runningNumber.textContent =
        formatTime(seconds);


        // カウント中は常に通常色
    runningNumber.classList.remove(
        "stopped-high",
        "stopped-low"
    );


    playBGM();


    timerInterval =
        setInterval(
            () => {

                if (!activeTimer) {
                    return;
                }


                if (
                    activeTimer.paused
                ) {
                    return;
                }


                activeTimer.remaining--;

                runningNumber.textContent =
                    formatTime(
                        activeTimer.remaining
                    );


            },
            1000
        );

}


/* =====================================================
   一時停止 / 再開
===================================================== */

function togglePause() {

    if (!activeTimer) {
        return;
    }


    activeTimer.paused =
        !activeTimer.paused;


    if (activeTimer.paused) {

        /*
         * 一時停止した瞬間の残り時間で色を決定
         */

        if (
            activeTimer.remaining >= 30
        ) {

            runningNumber.classList.remove(
                "stopped-low"
            );

            runningNumber.classList.add(
                "stopped-high"
            );

        } else {

            runningNumber.classList.remove(
                "stopped-high"
            );

            runningNumber.classList.add(
                "stopped-low"
            );

        }

    } else {

        /*
         * 再開したら通常色に戻す
         */

        runningNumber.classList.remove(
            "stopped-high",
            "stopped-low"
        );

    }

}


/* =====================================================
   Supabaseへログ保存
===================================================== */

async function saveLog() {

    if (!activeTimer) {
        return false;
    }


    const label =
        cards[
            activeTimer.cardIndex
        ]
        .querySelector("h2")
        .textContent
        .trim();


    const timerName =
        activeTimer.name;


    const remaining =
        Math.floor(
            activeTimer.remaining
        );


    const formatted =
        formatTime(
            remaining
        );


    console.log(
        "Saving timer log:",
        {
            timerName,
            label,
            remaining,
            formatted
        }
    );


    const {
        error
    } = await db
        .from("timer_logs")
        .insert({

            label:
                label,

            remaining_seconds:
                remaining,

            remaining_formatted:
                formatted,

            stopped_at:
                new Date().toISOString()

        });


    if (error) {

        console.error(
            "Supabase INSERT ERROR:",
            error
        );

        alert(
            "ログの保存に失敗しました。\n\n"
            +
            error.message
        );

        return false;

    }


    console.log(
        "Supabase INSERT SUCCESS:",
        timerName
    );


    return true;

}


/* =====================================================
   終了
===================================================== */

async function finishTimer() {

    if (!activeTimer) {
        return;
    }


    clearInterval(
        timerInterval
    );

    timerInterval = null;


    await saveLog();


    setTimeout(
        () => {

            returnToInitial();

        },
        800
    );

}


/* =====================================================
   キャンセル
===================================================== */

async function cancelTimer() {

    if (!activeTimer) {
        return;
    }


    clearInterval(
        timerInterval
    );

    timerInterval = null;


    await saveLog();


    returnToInitial();

}


/* =====================================================
   初期画面へ戻る
===================================================== */

function returnToInitial() {

    clearInterval(
        timerInterval
    );

    timerInterval = null;


    activeTimer = null;


    runningScreen.classList.remove(
        "show"
    );


    runningNumber.classList.remove(
        "stopped-high",
        "stopped-low"
    );


    runningNumber.textContent =
        formatTime(
            Number(
                cards[selected]
                    .dataset
                    .seconds
            )
        );


    title.classList.remove(
        "hidden"
    );

    hint.classList.remove(
        "hidden"
    );

    timers.classList.remove(
        "hidden"
    );


    updateSelection();


    /*
     * 初期画面に戻ったあとも
     * キーボードフォーカスを復帰
     */
    setTimeout(
        () => {

            restoreKeyboardFocus();

        },
        50
    );

}


/* =====================================================
   カードクリック
===================================================== */

cards.forEach(
    (card, index) => {


        card.addEventListener(
            "click",
            (event) => {

                if (activeTimer) {
                    return;
                }


                selected = index;

                updateSelection();


                playBGM();


                restoreKeyboardFocus();

            }
        );


        const button =
            card.querySelector(
                ".start-btn"
            );


        button.addEventListener(
            "click",
            async (event) => {

                event.stopPropagation();


                if (activeTimer) {
                    return;
                }


                selected = index;

                updateSelection();


                await playBGM();


                startTimer(
                    index
                );

            }
        );

    }
);


/* =====================================================
   キーボード操作
===================================================== */

/*
 * documentではなくwindowで受け取る
 *
 * これによりページ内の特定要素に
 * フォーカスが移っていても
 * キーイベントを拾いやすくする
 */
window.addEventListener(
    "keydown",
    async (event) => {

        console.log(
            "KEY:",
            event.code,
            "activeTimer:",
            !!activeTimer
        );


        /* =========================================
           J
        ========================================= */

        if (
            event.code === "KeyJ"
        ) {

            if (!activeTimer) {

                selected--;

                if (
                    selected < 0
                ) {

                    selected =
                        cards.length - 1;

                }

                updateSelection();

            }

            event.preventDefault();

            return;
        }


        /* =========================================
           L
        ========================================= */

        if (
            event.code === "KeyL"
        ) {

            if (!activeTimer) {

                selected++;

                if (
                    selected >=
                    cards.length
                ) {

                    selected = 0;

                }

                updateSelection();

            }

            event.preventDefault();

            return;
        }


        /* =========================================
           Space
        ========================================= */

        if (
            event.code === "Space"
        ) {

            /*
             * Spaceの標準動作
             * （ボタンのクリック等）を止める
             */
            event.preventDefault();


            /*
             * キーリピートによる
             * 多重処理を防止
             */
            if (event.repeat) {
                return;
            }


            if (!activeTimer) {

                await playBGM();

                startTimer(
                    selected
                );

            }

            else {

                togglePause();

            }


            return;
        }


        /* =========================================
           Backspace
        ========================================= */

        if (
            event.code === "Backspace"
        ) {

            event.preventDefault();


            /*
             * キーリピートによる
             * 多重キャンセルを防止
             */
            if (event.repeat) {
                return;
            }


            if (activeTimer) {

                await cancelTimer();

            }


            return;
        }

    },
    true
);


/* =====================================================
   初期化
===================================================== */

updateSelection();


audioStart.classList.remove(
    "hidden"
);


/*
 * 初期フォーカス
 */
restoreKeyboardFocus();


console.log(
    "Timer initialized."
);

console.log(
    "Keyboard:",
    "J = previous",
    "L = next",
    "Space = start/pause/resume",
    "Backspace = cancel"
);

console.log(
    "Timer names:",
    "1m25s = T",
    "1m30s = W",
    "1m35s = S"
);

</script>

</body>
</html>
