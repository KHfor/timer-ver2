<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
               maximum-scale=1.0, user-scalable=no">

<title>Timer</title>

<style>

@font-face {
    font-family: "DSEG7 Classic";
    src:
        url("https://manzdev.github.io/twitch-casio/dseg7-bold.woff2")
        format("woff2"),
        url("https://manzdev.github.io/twitch-casio/dseg7-bold.woff")
        format("woff");
    font-display: swap;
}

* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
}

body {
    font-family:
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        sans-serif;

    background: #000000;

    color: #39FF14;

    display: flex;
    flex-direction: column;
    align-items: center;

    overflow: hidden;

    touch-action: manipulation;
}


/* =========================
   初期画面
========================= */

h1 {
    font-size: 18px;

    color: #39FF14;

    margin: 24px 0 4px;

    letter-spacing: 3px;

    font-weight: 500;
}


.hint {
    font-size: 11px;

    color: #3d5c35;

    margin-bottom: 20px;

    letter-spacing: 1px;

    text-align: center;

    transition: opacity 0.2s;
}


/* =========================
   タイマー選択エリア
========================= */

.timers {
    display: flex;

    flex-wrap: wrap;

    gap: 40px;

    justify-content: center;

    align-items: flex-start;

    width: 100%;

    max-width: 900px;

    padding: 0 16px;
}


.card {
    text-align: center;

    padding: 8px;

    cursor: pointer;

    opacity: 0.55;

    transition: opacity 0.15s;
}


.card.selected {
    opacity: 1;
}


.card h2 {
    font-size: 14px;

    color: #39FF14;

    margin: 0 0 10px;

    font-weight: 500;

    letter-spacing: 1px;
}


.card .display {
    font-family:
        "DSEG7 Classic",
        "DSEG",
        monospace;

    font-size: 36px;

    color: #39FF14;

    margin-bottom: 14px;

    letter-spacing: 2px;
}


/* =========================
   STARTボタン
========================= */

button {
    border: none;

    border-radius: 999px;

    padding: 8px 24px;

    font-size: 13px;

    font-weight: 600;

    cursor: pointer;

    font-family: inherit;

    -webkit-tap-highlight-color: transparent;
}


.start-btn {
    background: #39FF14;

    color: #0a0a0a;
}


.start-btn:hover {
    opacity: 0.85;
}


.start-btn:active {
    transform: scale(0.96);
}


/* =========================
   実行中画面
========================= */

.running-screen {

    position: fixed;

    top: 0;
    left: 0;

    width: 100vw;
    height: 100vh;

    display: none;

    pointer-events: none;

    z-index: 100;
}


.running-screen.show {
    display: block;
}


.running-number {

    position: absolute;

    top: 65%;
    left: 50%;

    transform:
        translate(-50%, -50%);

    font-family:
        "DSEG7 Classic",
        "DSEG",
        monospace;

    font-size: 22vw;

    line-height: 1;

    color: #39FF14;

    letter-spacing: 4px;

    white-space: nowrap;

    text-align: center;
}


.running-number.paused {
    color: #FF6633;
}


/* =========================
   BGMボタン
========================= */

.audio-start {

    position: fixed;

    bottom: 18px;
    left: 50%;

    transform:
        translateX(-50%);

    z-index: 200;

    background: transparent;

    color: #3d5c35;

    border: 1px solid #3d5c35;

    padding: 6px 16px;

    font-size: 11px;

    letter-spacing: 0.5px;
}


.audio-start.hidden {
    display: none;
}


/* =========================
   非表示
========================= */

.hidden {
    display: none !important;
}

</style>
</head>


<body>


<!-- =========================
     初期画面
========================= -->

<h1 id="title">
    TIMER
</h1>


<div id="hint" class="hint">
    Click to Select / Space to Start, pause or resume / Backspace to Cancel
</div>


<div id="timers" class="timers">


    <!-- 1分25秒 -->

    <div class="card selected" data-seconds="85">

        <h2>
            1m25s
        </h2>

        <div class="display">
            01:25
        </div>

        <button class="start-btn">
            START
        </button>

    </div>


    <!-- 1分30秒 -->

    <div class="card" data-seconds="90">

        <h2>
            1m30s
        </h2>

        <div class="display">
            01:30
        </div>

        <button class="start-btn">
            START
        </button>

    </div>


    <!-- 1分35秒 -->

    <div class="card" data-seconds="95">

        <h2>
            1m35s
        </h2>

        <div class="display">
            01:35
        </div>

        <button class="start-btn">
            START
        </button>

    </div>

</div>


<!-- =========================
     実行中画面
========================= -->

<div id="runningScreen"
     class="running-screen">

    <div id="runningNumber"
         class="running-number">
        01:25
    </div>

</div>


<!-- =========================
     BGM
========================= -->

<audio id="bgm"
       src="./bgmpacman.mp3"
       loop
       preload="auto">
</audio>


<button id="audioStart"
        class="audio-start">

    TAP TO START MUSIC

</button>


<!-- Supabase -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

/* =====================================================
   Supabase
===================================================== */

const SUPABASE_URL =
    "https://hkogobchcvryyzuelfxw.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_anNXiP87LyAP-HUE-5tlGQ_ia6q2xEE";


const db =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =====================================================
   DOM
===================================================== */

const title =
    document.getElementById("title");

const hint =
    document.getElementById("hint");

const timers =
    document.getElementById("timers");

const cards =
    document.querySelectorAll(".card");

const runningScreen =
    document.getElementById("runningScreen");

const runningNumber =
    document.getElementById("runningNumber");

const audioStart =
    document.getElementById("audioStart");

const bgm =
    document.getElementById("bgm");


/* =====================================================
   Timer variables
===================================================== */

let selected = 0;

let activeTimer = null;

let timerInterval = null;


/* =====================================================
   時間表示
===================================================== */

function formatTime(seconds) {

    seconds =
        Math.max(
            0,
            Math.floor(seconds)
        );

    const minutes =
        Math.floor(seconds / 60);

    const secs =
        seconds % 60;

    return (
        String(minutes).padStart(2, "0")
        +
        ":"
        +
        String(secs).padStart(2, "0")
    );
}


/* =====================================================
   選択表示
===================================================== */

function updateSelection() {

    cards.forEach(
        (card, index) => {

            card.classList.toggle(
                "selected",
                index === selected
            );

        }
    );
}


/* =====================================================
   BGM
   タイマーとは完全に独立
===================================================== */

async function playBGM() {

    try {

        bgm.volume = 1.0;

        await bgm.play();

        audioStart.classList.add(
            "hidden"
        );

    } catch (error) {

        console.log(
            "BGM autoplay blocked:",
            error
        );

    }
}


/* BGMボタン */

audioStart.addEventListener(
    "click",
    async (event) => {

        event.stopPropagation();

        await playBGM();

    }
);


/*
 * 画面のどこをタップしても
 * BGM再生を試行
 *
 * iOS Safariではユーザー操作が
 * 必要になるため、最初のタップを
 * audio.play() に利用する
 */

document.addEventListener(
    "pointerdown",
    () => {

        if (bgm.paused) {

            playBGM();

        }

    },
    {
        passive: true
    }
);


/* =====================================================
   タイマー開始
===================================================== */

function startTimer(cardIndex) {

    if (activeTimer) {
        return;
    }


    const seconds =
        Number(
            cards[cardIndex]
                .dataset
                .seconds
        );


    activeTimer = {

        cardIndex: cardIndex,

        remaining: seconds,

        paused: false

    };


    /* 初期画面を隠す */

    title.classList.add(
        "hidden"
    );

    hint.classList.add(
        "hidden"
    );

    timers.classList.add(
        "hidden"
    );


    /* 実行画面 */

    runningScreen.classList.add(
        "show"
    );


    runningNumber.textContent =
        formatTime(seconds);


    runningNumber.classList.remove(
        "paused"
    );


    /* BGM */

    playBGM();


    /* タイマー開始 */

    timerInterval =
        setInterval(
            () => {

                if (!activeTimer) {
                    return;
                }


                if (
                    activeTimer.paused
                ) {
                    return;
                }


                activeTimer.remaining--;


                if (
                    activeTimer.remaining <= 0
                ) {

                    activeTimer.remaining = 0;

                    runningNumber.textContent =
                        "00:00";

                    finishTimer();

                    return;

                }


                runningNumber.textContent =
                    formatTime(
                        activeTimer.remaining
                    );

            },
            1000
        );

}


/* =====================================================
   一時停止 / 再開
===================================================== */

function togglePause() {

    if (!activeTimer) {
        return;
    }


    activeTimer.paused =
        !activeTimer.paused;


    if (
        activeTimer.paused
    ) {

        runningNumber.classList.add(
            "paused"
        );

    } else {

        runningNumber.classList.remove(
            "paused"
        );

    }

}


/* =====================================================
   Supabaseへログ保存
===================================================== */

async function saveLog() {

    if (!activeTimer) {
        return false;
    }


    const label =
        cards[
            activeTimer.cardIndex
        ]
        .querySelector("h2")
        .textContent
        .trim();


    const remaining =
        Math.max(
            0,
            Math.floor(
                activeTimer.remaining
            )
        );


    const formatted =
        formatTime(
            remaining
        );


    console.log(
        "Saving timer log:",
        {
            label,
            remaining,
            formatted
        }
    );


    const {
        error
    } = await db
        .from("timer_logs")
        .insert({

            label:
                label,

            remaining_seconds:
                remaining,

            remaining_formatted:
                formatted,

            stopped_at:
                new Date().toISOString()

        });


    if (error) {

        console.error(
            "Supabase INSERT ERROR:",
            error
        );

        alert(
            "ログの保存に失敗しました。\n\n"
            +
            error.message
        );

        return false;
    }


    console.log(
        "Supabase INSERT SUCCESS"
    );


    return true;

}


/* =====================================================
   終了
===================================================== */

async function finishTimer() {

    if (!activeTimer) {
        return;
    }


    clearInterval(
        timerInterval
    );

    timerInterval = null;


    /*
     * 00:00としてログ保存
     */

    await saveLog();


    /*
     * 少しだけ00:00を表示してから
     * 初期画面へ戻る
     */

    setTimeout(
        () => {

            returnToInitial();

        },
        800
    );

}


/* =====================================================
   キャンセル
===================================================== */

async function cancelTimer() {

    if (!activeTimer) {
        return;
    }


    clearInterval(
        timerInterval
    );

    timerInterval = null;


    /*
     * キャンセル時点の残り時間を保存
     */

    await saveLog();


    returnToInitial();

}


/* =====================================================
   初期画面へ戻る
===================================================== */

function returnToInitial() {

    clearInterval(
        timerInterval
    );

    timerInterval = null;


    activeTimer = null;


    runningScreen.classList.remove(
        "show"
    );


    runningNumber.classList.remove(
        "paused"
    );


    runningNumber.textContent =
        formatTime(
            Number(
                cards[selected]
                    .dataset
                    .seconds
            )
        );


    title.classList.remove(
        "hidden"
    );

    hint.classList.remove(
        "hidden"
    );

    timers.classList.remove(
        "hidden"
    );


    updateSelection();

}


/* =====================================================
   カードクリック
===================================================== */

cards.forEach(
    (card, index) => {


        card.addEventListener(
            "click",
            (event) => {

                /*
                 * タイマー実行中は無視
                 */

                if (activeTimer) {
                    return;
                }


                selected = index;

                updateSelection();


                /*
                 * BGM解除
                 */

                playBGM();

            }
        );


        /*
         * STARTボタン
         */

        const button =
            card.querySelector(
                ".start-btn"
            );


        button.addEventListener(
            "click",
            async (event) => {

                event.stopPropagation();


                if (activeTimer) {
                    return;
                }


                selected = index;

                updateSelection();


                /*
                 * ユーザー操作中にBGM開始
                 */

                await playBGM();


                startTimer(
                    index
                );

            }
        );

    }
);


/* =====================================================
   キーボード操作
===================================================== */

document.addEventListener(
    "keydown",
    async (event) => {


        /* J */

        if (
            event.code === "KeyJ"
        ) {

            if (!activeTimer) {

                selected--;

                if (
                    selected < 0
                ) {
                    selected =
                        cards.length - 1;
                }

                updateSelection();

            }

            return;
        }


        /* L */

        if (
            event.code === "KeyL"
        ) {

            if (!activeTimer) {

                selected++;

                if (
                    selected >=
                    cards.length
                ) {
                    selected = 0;
                }

                updateSelection();

            }

            return;
        }


        /* Space */

        if (
            event.code === "Space"
        ) {

            event.preventDefault();


            /*
             * タイマー未開始
             */

            if (!activeTimer) {

                await playBGM();

                startTimer(
                    selected
                );

            }

            /*
             * 実行中
             */

            else {

                togglePause();

            }

            return;
        }


        /* Backspace */

        if (
            event.code === "Backspace"
        ) {

            event.preventDefault();


            if (activeTimer) {

                await cancelTimer();

            }

            return;
        }

    }
);


/* =====================================================
   初期化
===================================================== */

updateSelection();


/*
 * BGMボタンは最初に表示
 */

audioStart.classList.remove(
    "hidden"
);


console.log(
    "Timer initialized."
);

console.log(
    "Supabase:",
    SUPABASE_URL
);

</script>

</body>
</html>
